name: Bug report
description: Something does not work as the docs say.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. …\n2. …"
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Relevo version (plugin.json), Claude Code version (`claude --version`), and OS.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The relevant output, as text.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: I removed tokens, passwords, email addresses, session ids and company data from everything I pasted
          required: true
